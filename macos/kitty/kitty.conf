# kitty.conf — recargar sin reiniciar: Ctrl+Cmd+,
include current-theme.conf

# ---------- Fuente ----------
font_family      JetBrainsMono Nerd Font
font_size        14.0
disable_ligatures never

# ---------- Ventana ----------
window_padding_width 10
hide_window_decorations titlebar-only
macos_titlebar_color background
background_opacity 0.96
# yabai decide el tamaño; recordarlo causa el "salto" al abrir
remember_window_size no
confirm_os_window_close 1

# ---------- Cursor y scroll ----------
cursor_shape beam
cursor_blink_interval 0.5
scrollback_lines 20000
copy_on_select yes

# ---------- Pestañas ----------
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template "{index}: {title}"

# ---------- Splits ----------
enabled_layouts splits,stack

# ---------- macOS ----------
# Teclado Latin American: Option debe escribir símbolos (Option+Q = @)
macos_option_as_alt no
macos_quit_when_last_window_closed yes

# ---------- Atajos ----------
# Pestañas: Cmd+T nueva, Cmd+W cerrar, Cmd+1..9 ir a pestaña
map cmd+t new_tab_with_cwd
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5

# Splits: Cmd+D vertical, Cmd+Shift+D horizontal, Cmd+flechas para moverse
map cmd+d launch --location=vsplit --cwd=current
map cmd+shift+d launch --location=hsplit --cwd=current
map cmd+left  neighboring_window left
map cmd+right neighboring_window right
map cmd+up    neighboring_window up
map cmd+down  neighboring_window down
map cmd+enter toggle_layout stack

# Limpiar pantalla y scrollback
map cmd+k clear_terminal to_cursor active

# Tamaño de fuente
map cmd+equal change_font_size all +1.0
map cmd+minus change_font_size all -1.0
map cmd+0     change_font_size all 0
