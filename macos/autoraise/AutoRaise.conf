# AutoRaise — foco (y traer al frente) la ventana bajo el mouse, como focus_follows_mouse.
# Recargar: launchctl kickstart -k gui/$(id -u)/local.autoraise
pollMillis=20
delay=1
requireMouseStop=false
mouseDelta=0.0
warpX=0
warpY=0
disableKey="control"
# Mientras una de estas tenga el foco, pasar el mouse por otras ventanas no se lo quita
# (capturas, contraseñas, y apps "flotantes" que si no quedan tapadas). Clic para salir.
stayFocusedBundleIds="com.apple.screencaptureui,com.apple.SecurityAgent,com.apple.systempreferences,com.apple.calculator,com.apple.ActivityMonitor,com.apple.archiveutility,com.apple.UserNotificationCenter,com.apple.coreservices.uiagent,com.apple.accessibility.universalAccessAuthWarn,com.apple.CoreServicesUIAgent,com.apple.Installer,com.apple.LocalAuthentication.UIAgent"
