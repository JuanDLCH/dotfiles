# AutoRaise — foco (y traer al frente) la ventana bajo el mouse, como focus_follows_mouse.
# Recargar: launchctl kickstart -k gui/$(id -u)/local.autoraise
pollMillis=20
delay=1
requireMouseStop=false
mouseDelta=0.0
warpX=0
warpY=0
disableKey="control"
# No quitarle el foco a estas mientras estén activas (capturas, contraseñas del sistema)
stayFocusedBundleIds="com.apple.screencaptureui,com.apple.SecurityAgent"
