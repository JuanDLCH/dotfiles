# my-linux-configs: personal kitty settings, included from ~/.config/kitty/kitty.conf
# (the include line is added by chezmoi; the distro's kitty.conf is left as is).

# Minimal tab bar
tab_bar_edge                bottom
tab_bar_style               powerline
tab_powerline_style         slanted
tab_title_template          {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}

# Start new windows without restoring cached maximized state.
remember_window_size no
